name: Release
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the four binaries
        run: python3 release/build.py --output "$RUNNER_TEMP/rook-build"
      - name: Verify qualified hashes and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 release/package.py --build-output "$RUNNER_TEMP/rook-build"
          --version "$RELEASE_TAG" --output "$RUNNER_TEMP/rook-release"
      - name: Publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: bash release/publish.sh "$RELEASE_TAG" "$RUNNER_TEMP/rook-release"
